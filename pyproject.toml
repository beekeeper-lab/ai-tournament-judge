[build-system]
requires = ["setuptools>=68"]
# An in-tree backend that stages atj/data/ first. A wheel without that data
# installs a command that cannot start, and the staging step used to be a line
# in the release checklist rather than part of the build.
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "ai-tournament-judge"
version = "0.4.0b0"
description = "Deterministic tooling for an AI-judged software tournament"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "PyYAML>=6.0",
    "jsonschema>=4.18",
    "referencing>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
atj = "atj.cli:main"

[tool.setuptools]
packages = ["atj"]
include-package-data = true

[tool.setuptools.package-data]
# The tooling reads its canonical facts from these files at run time. A wheel
# without them installs a command that cannot start.
atj = [
    "data/framework/**/*",
    "data/schemas/*.json",
    "data/events/_template/**/*",
    "data/VERSION",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
